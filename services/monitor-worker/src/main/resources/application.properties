spring.application.name=monitor-worker

# ============================================================
# 1. Credenciais Fake para o LocalStack
# ============================================================
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test

# ============================================================
# 2. Região AWS
# ============================================================
spring.cloud.aws.region.static=us-east-1

# ============================================================
# 3. Endpoint LocalStack (SQS)
# ============================================================
spring.cloud.aws.endpoint=http://localhost:4566
spring.cloud.aws.sqs.endpoint=http://localhost:4566

# ============================================================
# 4. Endpoint SQS para o monitor
# ============================================================
monitor.sqs.endpoint=http://localhost:4566

# ============================================================
# 5. PostgreSQL (mesmo banco dos outros workers)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/asyncflow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# 6. JPA / Hibernate (somente leitura - nao cria tabelas)
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# ============================================================
# 7. Porta do servidor
# ============================================================
server.port=8083

# ============================================================
# 8. Thymeleaf
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============================================================
# 9. Swagger / OpenAPI
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ============================================================
# 10. Logs
# ============================================================
logging.level.com.example.AsyncFlow=INFO
logging.level.io.awspring.cloud.sqs=WARN

# ============================================================
# 11. Desabilita o SQS listener (monitor apenas consulta, nao consome)
# ============================================================
spring.cloud.aws.sqs.listener.auto-startup=false
